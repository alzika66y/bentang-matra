<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALERI VISUAL | Bentang Matra</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #FFFFFF;
            --text-main: #004D00;
            --font-main: 'Poppins', Arial, sans-serif;
            --radius: 12px;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body { 
            background-color: var(--bg-base); 
            font-family: var(--font-main);
            color: var(--text-main);
        }

        /* --- NAVIGASI ATAS --- */
        .header-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(0, 77, 0, 0.1);
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 20px;
            background: #F4F9F4;
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: var(--text-main);
            color: #fff;
            box-shadow: 0 4px 12px rgba(0,77,0,0.15);
        }

        .btn-back svg {
            width: 18px; 
            height: 18px; 
            fill: currentColor;
        }

        .header-title {
            margin-left: 20px;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* --- PINTEREST MASONRY GRID --- */
        .gallery-container {
            padding: 20px 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .masonry-grid {
            column-count: 4;
            column-gap: 16px;
        }

        .masonry-item {
            display: inline-block;
            width: 100%;
            margin-bottom: 16px;
            break-inside: avoid;
            page-break-inside: avoid;
            -webkit-column-break-inside: avoid;
            
            border-radius: var(--radius);
            overflow: hidden;
            position: relative;
            
            /* Background netral: sangat berguna jika foto berformat PNG transparan */
            background-color: #F4F9F4; 
            border: 1px solid rgba(0, 77, 0, 0.05); /* Sedikit garis batas agar PNG terlihat tegas */
        }

        .masonry-item img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover; /* Memastikan foto mengisi ruang tanpa terdistorsi */
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .masonry-item:hover img {
            transform: scale(1.03);
        }

        .masonry-item::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 40%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        
        .masonry-item:hover::after {
            opacity: 1;
        }

        /* --- RESPONSIVITAS (PRESISI DESKTOP & MOBILE) --- */
        @media (max-width: 1200px) {
            .masonry-grid { column-count: 3; }
        }

        @media (max-width: 768px) {
            .header-nav { padding: 12px 15px; }
            .gallery-container { padding: 15px; }
            
            .masonry-grid { 
                column-count: 2; 
                column-gap: 10px; 
            }
            .masonry-item { 
                margin-bottom: 10px; 
                border-radius: 8px; 
            }
            .masonry-item:hover img {
                transform: none; 
            }
        }
    </style>
</head>
<body>

    <header class="header-nav">
        <a href="index.html" class="btn-back">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            Dashboard
        </a>
        <div class="header-title">Arsip Visual Murni</div>
    </header>

    <main class="gallery-container">
        <div class="masonry-grid">
            
            <div class="masonry-item">
                <img src="foto1.jpg" alt="Dokumentasi 1" loading="lazy">
            </div>
            
            <div class="masonry-item">
                <img src="foto2.png" alt="Dokumentasi 2" loading="lazy">
            </div>
            
            <div class="masonry-item">
                <img src="foto3.jpeg" alt="Dokumentasi 3" loading="lazy">
            </div>
            
            <div class="masonry-item">
                <img src="foto4.webp" alt="Dokumentasi 4" loading="lazy">
            </div>
            
            <div class="masonry-item">
                <img src="foto5.jpg" alt="Dokumentasi 5" loading="lazy">
            </div>

            </div>
    </main>

</body>
</html>
